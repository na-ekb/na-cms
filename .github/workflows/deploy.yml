name: Deploy

on:
  # Релиз-модель: публикация GitHub Release веером катит на группу окружений.
  #   pre-release  → все окружения с role: test
  #   full release → все окружения с role: prod
  release:
    types: [published]
  # Ручной fallback: катит одно выбранное окружение.
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение для деплоя"
        required: true
        type: choice
        options:
          - ekb
          - test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  # ─── 0. Resolve: reuse existing build artifact for this commit ────────────
  resolve:
    name: Resolve build artifact
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=build-${{ github.sha }}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last')
          if [ -n "$latest" ] && [ "$latest" != "null" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$(echo "$latest" | jq -r '.workflow_run.id')" >> "$GITHUB_OUTPUT"
            echo "♻️ Найден артефакт build-${{ github.sha }}, сборку пропускаем"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🔨 Артефакта нет — будет сборка"
          fi

  # ─── 0b. Resolve target environments from manifest ────────────────────────
  set-matrix:
    name: Resolve target environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              ROLE="test"
            else
              ROLE="prod"
            fi
            MATRIX=$(jq -c --arg role "$ROLE" '[.[] | select(.role == $role)]' .github/deploy-environments.json)
            echo "🎯 Release (${ROLE}) → $MATRIX"
          else
            NAME="${{ inputs.environment }}"
            MATRIX=$(jq -c --arg name "$NAME" '[.[] | select(.name == $name)]' .github/deploy-environments.json)
            echo "🎯 Manual (${NAME}) → $MATRIX"
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then
            echo "::warning::Нет подходящих окружений в манифесте — деплой не будет выполнен"
          fi

  # ─── 1. Gitleaks: scan for leaked secrets ─────────────────────────────────
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Build: PHP deps + frontend assets ─────────────────────────────────
  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, zip, gd, intl
          coverage: none

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        run: composer install --no-interaction --no-dev --prefer-dist --no-scripts
        env:
          COMPOSER_AUTH: >-
            {
              "github-oauth": {"github.com": "${{ secrets.OC_PACKAGES_TOKEN }}"},
              "bearer": {"raw.githubusercontent.com": "${{ secrets.OC_PACKAGES_TOKEN }}"}
            }

      - name: Composer dump-autoload
        run: composer dump-autoload --no-interaction --no-scripts --optimize

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm install
        run: npm ci

      - name: Build assets
        run: npm run production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          include-hidden-files: true
          path: |
            .
            !.git
            !node_modules
            !.docker
            !tests
          retention-days: 7

  # ─── 3. Deploy (fan-out по окружениям из set-matrix) ──────────────────────
  deploy:
    name: Deploy → ${{ matrix.name }}
    needs: [secrets, resolve, build, set-matrix]
    if: >-
      always() &&
      needs.set-matrix.result == 'success' &&
      needs.set-matrix.outputs.matrix != '[]' &&
      needs.secrets.result == 'success' &&
      needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          run-id: ${{ needs.resolve.outputs.exists == 'true' && needs.resolve.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install SOPS + age
        run: |
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.2.0/age-v1.2.0-linux-amd64.tar.gz | tar -xz -C /tmp
          mv /tmp/age/age /usr/local/bin/age

      - name: Decrypt .env
        run: sops -d ${{ matrix.env_file }} > .env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Проверяем, что ключ валиден и распознаётся до попытки подключения
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY невалиден (error in libcrypto): проверьте формат/переносы строк/passphrase"; exit 1; }

      - name: Create release dir
        id: release
        run: |
          RELEASE_NAME=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="${{ matrix.base }}/releases/$RELEASE_NAME"
          ssh -i ~/.ssh/id_ed25519 ${{ matrix.user }}@${{ matrix.host }} "mkdir -p $RELEASE_DIR"
          echo "dir=$RELEASE_DIR" >> $GITHUB_OUTPUT

      - name: Upload .env to shared folder
        run: |
          scp -i ~/.ssh/id_ed25519 .env \
            ${{ matrix.user }}@${{ matrix.host }}:${{ matrix.base }}/.env

      - name: rsync to release dir
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.idea' \
            --exclude='.docker' \
            --exclude='.DS_Store' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='.php_cs' \
            --exclude='.php_cs.cache' \
            --exclude='.phpstorm.meta.php' \
            --exclude='.babelrc' \
            --exclude='.jshintrc' \
            --exclude='.styleci.yml' \
            --exclude='.travis.yml' \
            --exclude='.sops.yaml' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='/server.php' \
            --exclude='/webpack.config.js' \
            --exclude='/webpack.mix.js' \
            --exclude='/webpack.helpers.js' \
            --exclude='phpcs.xml' \
            --exclude='phpunit.xml' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='auth.json' \
            --exclude='_ide_helper.php' \
            --exclude='README.md' \
            --exclude='CHANGELOG.md' \
            --exclude='LICENSE.md' \
            --exclude='SECURITY.md' \
            --exclude='DEPLOY.md' \
            --exclude='SOPS.md' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ${{ matrix.user }}@${{ matrix.host }}:${{ steps.release.outputs.dir }}/

      # version.json пишется per-окружение прямо в папку релиза, ПОСЛЕ rsync
      # (иначе rsync --delete снёс бы его) и ДО переключения симлинка current
      # в Post-deploy (чтобы прочитать sha предыдущего релиза для changelog).
      - name: Write version.json
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ matrix.name }}
          ROLE: ${{ matrix.role }}
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_USER: ${{ matrix.user }}
          BASE: ${{ matrix.base }}
          RELEASE_DIR: ${{ steps.release.outputs.dir }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -e
          SHORT_SHA="${SHA:0:7}"
          if [ "$EVENT" = "release" ]; then
            REF_TYPE="release"; VERSION="$RELEASE_TAG"; BRANCH="$RELEASE_TARGET"
          else
            REF_TYPE="manual"; VERSION="$SHORT_SHA"; BRANCH="$REF_NAME"
          fi
          COMMIT_URL="https://github.com/$REPO/commit/$SHA"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # sha предыдущего релиза этого окружения (симлинк current ещё не переключён)
          PREV=$(ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat $BASE/current/version.json 2>/dev/null" | jq -r '.sha // empty' 2>/dev/null || true)

          # changelog: коммиты с прошлого деплоя (compare), иначе последние 10
          if [ -n "$PREV" ] && gh api "repos/$REPO/compare/$PREV...$SHA" > /tmp/cmp.json 2>/dev/null; then
            CHANGELOG=$(jq '[.commits[] | {sha: .sha, short: .sha[0:7], subject: (.commit.message | split("\n")[0]), url: .html_url}]' /tmp/cmp.json)
          else
            gh api "repos/$REPO/commits?sha=$SHA&per_page=10" > /tmp/commits.json
            CHANGELOG=$(jq '[.[] | {sha: .sha, short: .sha[0:7], subject: (.commit.message | split("\n")[0]), url: .html_url}]' /tmp/commits.json)
          fi

          jq -n \
            --arg environment "$ENVIRONMENT" \
            --arg role "$ROLE" \
            --arg version "$VERSION" \
            --arg ref_type "$REF_TYPE" \
            --arg sha "$SHA" \
            --arg short_sha "$SHORT_SHA" \
            --arg branch "$BRANCH" \
            --arg deployed_at "$DEPLOYED_AT" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg commit_url "$COMMIT_URL" \
            --arg release_url "$RELEASE_URL" \
            --arg release_notes "$RELEASE_BODY" \
            --arg prev_sha "$PREV" \
            --argjson changelog "$CHANGELOG" \
            '{environment: $environment, role: $role, version: $version, ref_type: $ref_type, sha: $sha, short_sha: $short_sha, branch: $branch, deployed_at: $deployed_at, actor: $actor, repo: $repo, commit_url: $commit_url, release_url: $release_url, release_notes: $release_notes, prev_sha: $prev_sha, changelog: $changelog}' \
            > version.json

          scp -i ~/.ssh/id_ed25519 version.json "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_DIR/version.json"

      - name: Post-deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ matrix.user }}@${{ matrix.host }} << EOF
            set -e
            BASE=${{ matrix.base }}
            RELEASE=${{ steps.release.outputs.dir }}

            cp \$BASE/.env \$RELEASE/.env
            ln -sfn \$BASE/storage \$RELEASE/storage

            cd \$RELEASE
            # vendor приезжает из CI-артефакта; на сервере лишь пересобираем
            # автозагрузчик под серверные пути (без сети, без oc-packages)
            /usr/local/bin/php8.2 /home/d/design24/.local/bin/composer dump-autoload --no-interaction --no-dev --optimize --no-scripts
            php8.2 artisan optimize:clear
            php8.2 artisan optimize
            php8.2 artisan october:migrate

            ln -sfn \$RELEASE \$BASE/current
            ln -sfn \$BASE/current \$BASE/public_html

            ls -dt \$BASE/releases/*/ | tail -n +4 | xargs rm -rf
          EOF
