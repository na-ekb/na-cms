name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Что откатываем"
        required: true
        type: choice
        options:
          - ekb
          - test
          - all-prod
          - all-test

permissions:
  contents: read

jobs:
  # ─── Resolve target environments from manifest ────────────────────────────
  set-matrix:
    name: Resolve rollback targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has: ${{ steps.build.outputs.has }}
    steps:
      - uses: actions/checkout@v4

      - id: build
        run: |
          case "${{ inputs.environment }}" in
            all-prod)
              SEL=$(jq -c '[.[] | select(.role == "prod")]' .github/deploy-environments.json)
              ;;
            all-test)
              SEL=$(jq -c '[.[] | select(.role == "test")]' .github/deploy-environments.json)
              ;;
            *)
              SEL=$(jq -c --arg name "${{ inputs.environment }}" '[.[] | select(.name == $name)]' .github/deploy-environments.json)
              ;;
          esac
          echo "🎯 Rollback targets: $SEL"
          # name — реальная ось matrix, чтобы ${{ matrix.name }} раскрывался в имени job
          MATRIX=$(echo "$SEL" | jq -c '{name: [.[].name], include: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "has=$(echo "$SEL" | jq 'length > 0')" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$SEL" | jq 'length')" = "0" ]; then
            echo "::warning::Нет подходящих окружений в манифесте — откат не будет выполнен"
          fi

  # ─── Rollback (fan-out по выбранной группе) ───────────────────────────────
  rollback:
    name: Rollback → ${{ matrix.name }}
    needs: set-matrix
    if: needs.set-matrix.outputs.has == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Rollback to previous release
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ matrix.user }}@${{ matrix.host }} bash -se << EOF
            set -e
            BASE="${{ matrix.base }}"

            CURRENT=\$(readlink "\$BASE/current")
            PREV=\$(ls -dt "\$BASE"/releases/*/ | sed 's:/\$::' | grep -v "^\$CURRENT\$" | head -1)

            if [ -z "\$PREV" ]; then
              echo "Нет предыдущего релиза для отката"
              exit 1
            fi

            echo "Текущий:  \$CURRENT"
            echo "Откат на: \$PREV"

            ln -sfn "\$PREV" "\$BASE/current"

            cd "\$PREV"
            php8.4 artisan optimize:clear
            php8.4 artisan optimize

            echo "Готово. Активный релиз: \$(readlink "\$BASE/current")"
          EOF
